<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ee">
  <title>标准化的世界</title>
  <link rel="stylesheet" href="exhibit.css">
  <link rel="stylesheet" href="setup.css">
  <script defer src="scale.js"></script>
  <script defer src="data.js"></script>
  <script defer src="catalog.js"></script>
  <script defer src="setup.js"></script>
  <script defer src="exhibit.js"></script>
</head>
<body>
  <main id="exhibit" data-scene="idle">
    <section id="poster" aria-labelledby="poster-title">
      <div class="poster-composition">
        <div class="reference-strip">
          <div id="reference" class="reference">
            <span class="reference-label"><span class="measure-number">10</span> cm<span id="calibration-note"> · 待校准</span></span>
            <span class="rule" aria-hidden="true"></span>
          </div>
        </div>
        <h1 id="poster-title" tabindex="-1"><span>标准化</span><span>的世界</span></h1>
      </div>
      <button type="button" class="action" id="start">开始画<span class="arrow" aria-hidden="true"></span></button>
    </section>
    <div id="viewport" hidden>
      <div id="world">
        <svg id="ink" xmlns="http://www.w3.org/2000/svg" aria-label="你的画布" role="img"><g id="drawing"></g></svg>
        <section id="comparison" hidden aria-label="画稿和匹配物件">
          <div id="sketch-note">
            <p class="sketch-label">你的原画</p>
            <div id="art-slot" aria-hidden="true"></div>
            <p id="art-size"></p>
            <p id="match-basis"></p>
          </div>
          <div id="card-slot">
            <p id="search-status" role="status">正在比对尺寸<span aria-hidden="true">…</span></p>
            <article id="object-card" hidden>
              <header class="card-heading">
                <p>尺寸相近的物件</p>
                <h2 id="object-name"></h2>
              </header>
              <div class="card-figures">
                <figure id="photo-reference">
                  <div class="figure-field"><img id="reference-photo" alt="" draggable="false"></div>
                  <figcaption id="photo-scope">参考图</figcaption>
                </figure>
                <figure id="outline-reference">
                  <div class="figure-field" id="outline-field">
                    <div id="standard-object" role="img"><span id="range-limit" hidden></span></div>
                  </div>
                  <figcaption id="outline-scale"></figcaption>
                </figure>
              </div>
              <div class="card-detail">
                <p id="object-size"></p>
                <p id="object-description"></p>
              </div>
            </article>
          </div>
        </section>
      </div>
    </div>
    <section id="drawing-ui" hidden aria-label="自由绘画">
      <p id="prompt" tabindex="-1">在这里，画一样你熟悉的东西。</p>
      <button type="button" class="action" id="finish" disabled>画好了<span class="arrow" aria-hidden="true"></span></button>
    </section>
    <div id="result-ui" hidden>
      <button type="button" class="action" id="next">下一轮<span class="arrow" aria-hidden="true"></span></button>
    </div>
  </main>
  <section id="calibration" hidden></section>
</body>
</html>
